<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMD Delivery Status</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1d2433; --muted: #5b6475; --line: #e3e6eb;
    --green: #1a7f37; --green-bg: #e6f4ea; --yellow: #8a6100; --yellow-bg: #fff4d6;
    --red: #b42318; --red-bg: #fde8e7; --grey: #5b6475; --grey-bg: #eef0f3; --blue: #1f5fbf;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 28px 0 10px; }
  .muted { color: var(--muted); font-size: .92rem; }
  .counts { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 6px; }
  .count { flex: 1 1 180px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
           padding: 12px 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .count b { display: block; font-size: 1.7rem; }
  .count.on { outline: 3px solid var(--blue); }
  .c-green b { color: var(--green); } .c-yellow b { color: var(--yellow); }
  .c-red b { color: var(--red); } .c-grey b { color: var(--grey); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { font-size: .85rem; color: var(--muted); background: #fafbfc; white-space: nowrap; }
  td.n, th.n { text-align: right; }
  tr.lga-row { cursor: pointer; } tr.lga-row:hover { background: #f3f6fb; }
  .bar { height: 8px; background: var(--grey-bg); border-radius: 4px; min-width: 80px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--green); }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 12px; }
  .tools select, .tools input { font: inherit; padding: 9px 11px; border: 1px solid #c9ced6; border-radius: 8px;
                                background: #fff; color: var(--ink); }
  .tools select, tools input { flex: 1 1 200px; max-width: 100%; }
  #fac { flex: 2 1 320px; }
  .btn { font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--blue); background: var(--blue);
         color: #fff; text-decoration: none; white-space: nowrap; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .85rem; white-space: nowrap; }
  .s-confirmed { background: var(--green-bg); color: var(--green); }
  .s-match { background: var(--yellow-bg); color: var(--yellow); }
  .s-nomatch { background: var(--red-bg); color: var(--red); }
  .s-notyet { background: var(--grey-bg); color: var(--grey); }
  .nw { white-space: nowrap; }
  .note { margin-top: 2px; font-size: .88rem; color: var(--muted); }
  a { color: var(--blue); }
  #empty { padding: 20px; color: var(--muted); display: none; }
  @media (max-width: 640px) {
    h1 { font-size: 1.3rem; }
    .hide-small { display: none; }
    .tools select, .tools input { flex: 1 1 100%; max-width: 100%; }
    /* facility list as simple cards on phones */
    #list thead { display: none; }
    #list tr { display: block; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    #list td { display: block; border: 0; padding: 2px 0; }
    #list td.lga-cell { font-size: .85rem; color: var(--muted); }
    #list td.nw { display: inline-block; margin-right: 14px; }
    .pill { white-space: normal; }
  }
</style>
</head>
<body>
<main>
  <h1 id="title">LMD delivery status</h1>
  <div class="muted" id="updated">Loading…</div>

  <div class="counts" id="counts"></div>
  <div class="muted">Tap a box to show only that status. Tap it again to show all.</div>

  <h2>By LGA</h2>
  <div class="box"><table id="lgas"></table></div>
  <div class="muted" style="margin-top:6px">Tap an LGA to see its facilities below.</div>

  <h2>Facilities</h2>
  <div class="tools">
    <select id="lga"><option value="">All LGAs</option></select>
    <input id="fac" list="facs" type="search" placeholder="Type or pick a facility…" autocomplete="off">
    <datalist id="facs"></datalist>
    <select id="status"><option value="">All statuses</option></select>
    <a class="btn" href="data/status.xlsx" download>Download Excel</a>
  </div>
  <div class="muted" id="showing" style="margin-bottom:8px"></div>
  <div class="box">
    <table id="list">
      <thead><tr><th>LGA</th><th>Facility</th><th>Status</th><th>Date</th><th>Map</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty">No facility matches what you picked.</div>
  </div>
</main>

<script>
const S = {
  "Reported delivered, location doesn't match": { key: "nomatch", icon: "🔴", order: 0, color: "red" },
  "Not reported yet":                         { key: "notyet",  icon: "⚪", order: 1, color: "grey" },
  "Reported delivered, location matches":     { key: "match",   icon: "🟡", order: 2, color: "yellow" },
  "Receipt confirmed by facility":            { key: "confirmed", icon: "✅", order: 3, color: "green" },
};
const SHOW = ["Receipt confirmed by facility", "Reported delivered, location matches",
              "Reported delivered, location doesn't match", "Not reported yet"];  // same order as the LGA table

// read a CSV file into a list of objects (handles "quoted, text")
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = rows.shift();
  return rows.filter(r => r.length > 1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] || ""])));
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);

let all = [];

async function load() {
  const get = (f, json) => fetch(f + "?t=" + Date.now()).then(r => { if (!r.ok) throw f; return json ? r.json() : r.text(); });
  const [status, facs, round, updated] = await Promise.all([
    get("data/status.csv"), get("data/facilities.csv"), get("data/round.json", true),
    get("data/updated.json", true).catch(() => ({})),
  ]);
  const where = {};
  parseCSV(facs).forEach(f => { if (f.Latitude && f.Longitude) where[f["S/N"]] = f.Latitude + "," + f.Longitude; });
  all = parseCSV(status).map(r => ({ ...r, s: S[r.Status] || S["Not reported yet"], map: where[r["S/N"]] || "" }));

  $("title").textContent = round.round + " delivery status";
  document.title = round.round + " delivery status";
  $("updated").textContent = updated.updated
    ? "Last updated: " + new Date(updated.updated).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
    : "";

  [...new Set(all.map(r => r.LGA))].sort().forEach(l => $("lga").add(new Option(l, l)));
  SHOW.forEach(s => $("status").add(new Option(S[s].icon + " " + s, s)));
  fillFacilities(); drawCounts(); drawLgas(); drawRows();
}

function drawCounts() {
  $("counts").innerHTML = SHOW.map(s => {
    const n = all.filter(r => r.Status === s).length;
    return `<button class="count c-${S[s].color} ${$("status").value === s ? "on" : ""}" data-s="${esc(s)}">
      <b>${S[s].icon} ${n}</b>${esc(s)}</button>`;
  }).join("");
  document.querySelectorAll(".count").forEach(b => b.onclick = () => {
    $("status").value = $("status").value === b.dataset.s ? "" : b.dataset.s;
    drawCounts(); drawRows();
    $("lga").scrollIntoView({ behavior: "smooth" });
  });
}

// the facility box suggests only the facilities of the LGA picked (or all, if no LGA is picked)
const label = r => r.Facility + " (" + r.LGA + ")";
function fillFacilities() {
  const lga = $("lga").value;
  $("fac").value = "";
  $("facs").innerHTML = all.filter(r => !lga || r.LGA === lga)
    .sort((a, b) => a.Facility.localeCompare(b.Facility))
    .map(r => `<option value="${esc(label(r))}">`).join("");
}

function drawLgas() {
  const by = {};
  all.forEach(r => {
    const x = by[r.LGA] ||= { total: 0, confirmed: 0, match: 0, nomatch: 0, notyet: 0 };
    x.total++; x[r.s.key]++;
  });
  const lgas = Object.keys(by).sort((a, b) => by[a].confirmed / by[a].total - by[b].confirmed / by[b].total || a.localeCompare(b));
  $("lgas").innerHTML = `<thead><tr><th>LGA</th><th class="n">Facilities</th><th class="n">✅</th>
    <th class="n">🟡</th><th class="n">🔴</th><th class="n">⚪</th><th class="hide-small">Confirmed</th></tr></thead><tbody>` +
    lgas.map(l => {
      const x = by[l], pct = Math.round(100 * x.confirmed / x.total);
      return `<tr class="lga-row" data-l="${esc(l)}"><td>${esc(l)}</td><td class="n">${x.total}</td>
        <td class="n">${x.confirmed}</td><td class="n">${x.match}</td><td class="n">${x.nomatch}</td><td class="n">${x.notyet}</td>
        <td class="hide-small"><div class="bar" title="${pct}%"><span style="width:${pct}%"></span></div></td></tr>`;
    }).join("") + "</tbody>";
  document.querySelectorAll(".lga-row").forEach(tr => tr.onclick = () => {
    $("lga").value = tr.dataset.l; fillFacilities(); drawRows();
    $("lga").scrollIntoView({ behavior: "smooth" });
  });
}

function drawRows() {
  const lga = $("lga").value, fac = $("fac").value.trim().toLowerCase(), st = $("status").value;
  const list = all.filter(r =>
    (!lga || r.LGA === lga) && (!fac || label(r).toLowerCase().includes(fac)) && (!st || r.Status === st));
  // problems first; confirmed-but-odd before plain confirmed
  list.sort((a, b) => (a.s.order - b.s.order) || ((b.Note ? 1 : 0) - (a.Note ? 1 : 0)) ||
                      a.LGA.localeCompare(b.LGA) || a.Facility.localeCompare(b.Facility));
  $("rows").innerHTML = list.map(r => {
    const warn = r.s.key === "confirmed" && r.Note ? " ⚠️" : "";
    const map = r.map ? `<a href="https://www.google.com/maps/search/?api=1&query=${r.map}" target="_blank" rel="noopener">📍 Map</a>` : "";
    return `<tr><td class="lga-cell">${esc(r.LGA)}</td><td>${esc(r.Facility)}${r.Note ? `<div class="note">${esc(r.Note)}</div>` : ""}</td>
      <td><span class="pill s-${r.s.key}">${r.s.icon} ${esc(r.Status)}</span>${warn}</td>
      <td class="nw">${esc(r.Date)}</td><td class="nw">${map}</td></tr>`;
  }).join("");
  $("empty").style.display = list.length ? "none" : "block";
  $("showing").textContent = `Showing ${list.length} of ${all.length} facilities`;
}

$("lga").onchange = () => { fillFacilities(); drawRows(); };
$("fac").oninput = drawRows;
$("status").onchange = () => { drawCounts(); drawRows(); };
load().catch(e => { $("updated").textContent = "Could not load the data (" + e + "). Try refreshing."; });
</script>
</body>
</html>
